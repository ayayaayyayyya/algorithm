steps:
# 1. Docker 이미지 빌드
- name: 'gcr.io/cloud-builders/docker'
  args: ['build', '-t', 'gcr.io/algorithm-511002/algorithm-git:$SHORT_SHA', '-f', 'bin/Dockerfile', '.']

# 2. Artifact Registry에 푸시
- name: 'gcr.io/cloud-builders/docker'
  args: ['push', 'gcr.io/algorithm-511002/algorithm-git:$SHORT_SHA']

# 3. Cloud Run 자동 배포
- name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
  entrypoint: gcloud
  args:
  - 'run'
  - 'deploy'
  - 'algorithm-service'
  - '--image=gcr.io/algorithm-511002/algorithm-git:$SHORT_SHA'
  - '--region=asia-northeast3'
  - '--platform=managed'
  - '--allow-unauthenticated'
